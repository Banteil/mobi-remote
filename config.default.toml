# ---- 던전 공통 ----
[dungeon]
# 클리어 화면 '화면을 터치해 주세요'를 넘길 때 누를 곳 — 왼쪽 끝 가운데. 예전 (960,330) 은 사냥터 보상 목록·퀘스트 클리어
# 보상 줄의 아이템 자리라 아이템을 눌러 상세·장비 비교 창이 열렸다 (2026-10-28, 친구 제보도 같음). 클리어·보상·퀘스트 클리어·
# 가방·장비 비교 화면 모두 이 자리는 비어 있다
touch_xy = [40, 600]
touch_text_region = [760, 970, 400, 60]  # '화면을 터치해 주세요' 글자 영역 (OCR)
window_close = "window_close_x"       # 전체 화면 창(가방·장비 비교·퀘스트 창 등) 오른쪽 위 X — 클리어 연출 중 잘못 열린 창을 닫는다

# ---- 숙제별 설정 ----
# open_steps: 메인 화면에서 차례로 클릭할 템플릿 → 마지막에 ui.dungeon_enter 클릭
# lack: 입장 재화 부족 시 뜨는 팝업 템플릿

# 아르바이트: 구인 중 목록을 위에서부터 지원 → 진행 → 완료, 목록이 빌 때까지 (mabi/tasks/arbeit.py 설명 참고)
[arbeit]
slots = []                            # 아르바이트를 도는 캐릭터 슬롯 (캐릭터 탭 ••• 에서 켬). 새 기능이라 기본은 아무도 안 함
max_jobs = 20                         # 한 캐릭터에서 처리할 최대 횟수 (지원·진행 합쳐서)
job_timeout = 480                     # 아르바이트 하나에 쓰는 시간 (초). 채집 개수가 늘고 있는 동안은 job_max 까지 늘어남
job_max = 1800                        # 채집이 길어져도 아르바이트 하나에 쓰는 최대 시간 (초)
travel_timeout = 180                  # '지원하기' 후 수락 대화가 뜰 때까지
idle_wait = 10                        # 메인 화면에서 이만큼 가만히 있으면 '진행하기' 를 다시 누른다 (초)
idle_wait_after_talk = 3              # NPC 대화를 마친 뒤에는 이만큼만 기다린다 (대화 조건을 채워도 게임이 다음 걸음으로 가지 않는다)
max_pushes = 5                        # 조건이 그대로인 채 '진행하기' 를 다시 누르는 최대 횟수 (조건이 바뀌면 다시 셈)
list_pages = 3                        # 목록을 몇 번 내려 가며 찾을지
list_scroll_at = [1540, 600]
accept = "arbeit_accept"              # NPC 대화의 '수락' (Space)
report = "npc_space_option"           # NPC 메뉴의 Space 선택지 ('결과 보고' 나 아르바이트 이름 버튼 — 초록 버튼의 Space 표시+G 아이콘)
deliver_title = "deliver_title"       # '전달하기' 창 제목
deliver_ready = "deliver_ready"       # 전달하기 버튼의 'Space' 표시 (물품이 다 채워져야 생김)
dialog_log = "dialog_log"             # NPC 대화 화면 왼쪽 위 '대화 기록' (대화 중인지 확인)
dialog_next_xy = [1800, 45]           # '대화 넘기기' 자리. 버튼이 없어도(한마디 대사) 눌러서 넘어간다
craft_list = "craft_facility_move"    # 제작 창 첫 화면의 '설비로 이동' (아르바이트가 요구하는 물품 카드가 그 아래 하나)
craft_item_from_list = [76, 237]      # '설비로 이동' 템플릿 왼쪽 위 → 물품 카드 가운데
craft_go = "craft_go"                 # 물품을 고른 뒤 '제작하러 가기' (Space)
craft_make = "craft_make"             # 설비 앞 제작 창의 '제작하기' (Space)
craft_short_toast = "toast_no_material"  # 제작 버튼을 눌렀는데 재료가 모자라면 화면 위에 뜨는 '재료가 부족합니다.'
craft_transfer = "craft_transfer_title"  # '재료를 전송하시겠습니까?' (모자란 재료를 보관함에서) → 확인(Space)
alter_button = "alter_button"         # 가공 시설 창의 '가공하기' — 짧은 가공(alter_max_sec 미만)만 하고 나머지는 건너뜀
alter_max_sec = 120                   # 이 시간(초, 실제 가공 1회 — 레시피 표 sec) 미만인 가공품만 아르바이트에서 가공한다
alter_wait = 180                      # 가공을 걸고 끝날 때까지 기다리는 상한 (초)
item_missing = "item_missing"         # '퀘스트를 위해 필요한 아이템이 없습니다.' 창 제목
item_use = "item_use_button"          # 가방이 열리며 퀘스트 아이템에 '사용하기' (Space) — 아이템을 쓰는 일 (행운의 편지 등)
item_row_from_title = [170, 147]      # 그 제목 템플릿 왼쪽 위 → 첫 물품 줄 가운데 (누르면 '구하는 방법' 이 열린다)
howto_title = "howto_title"           # '구하는 방법' 창 제목
howto_area = [1200, 240, 720, 700]    # 구하는 방법 목록 (맨 위가 가장 가까운 '추천')
gather_timeout = 180                  # 채집 개수가 이만큼 늘지 않으면 포기 (초). 늘고 있으면 계속 기다림

# 점검자 (mabi.monitor): 태스크가 한 동작의 결과를 보고, 막는 화면을 처리하고, 헛돌기를 막는다
[monitor]
same_limit = 6                        # 같은 처리를 화면이 그대로인 채 이만큼 거듭하면 헛도는 것으로 보고 멈춤
unknown_limit = 60                    # 모르는 상황이 이만큼(초) 이어지면 메인 화면으로 한 번 돌려 보고, 또 그만큼이면 멈춤
act_within = 15                       # 동작 뒤 기대한 변화를 기다리는 기본 시간 (초)

# 퀘스트 창(J) → 아르바이트 탭 → '요일' 태그 카드의 '진행하기' → 던전 창 '요일 던전' 탭에서 기본 단계로 입장
[weekday_dungeon]
achieved = "guide_daily_weekday"     # 콘텐츠 가이드 일일 달성의 '요일 던전' (완료 체크 확인)
tag = "arbeit_weekday_tag"            # 아르바이트 카드의 '요일' 태그
go = "arbeit_go"                      # 아르바이트 카드의 '진행하기'
panel = [1220, 90, 680, 900]          # 퀘스트 창 오른쪽 목록 영역 [x, y, w, h]
dungeon_tab = "dungeon_tab_weekday_on" # 이동 도착 후 열리는 던전 창의 '요일 던전' 탭 (선택된 상태)
extra_loot = 3                        # 클리어 보상 화면의 추가 루팅 횟수 (최대 3, 골드 6천/1만2천/1만8천). 요일 던전에만 있음
travel_timeout = 300
clear_timeout = 600
# 일요일은 카드 진행하기가 마을 임무 게시판으로 가서 던전을 고른다: "골드"(빛나는 동굴) / "보석"(눈부신 저택) / "촉매"(찬란한 유적)
# 캐릭터별로는 [weekday_dungeon.sunday_by_slot] 에 "슬롯" = "골드" 처럼 (캐릭터 탭 설정 창에서 고른다)
sunday = "촉매"
board_timeout = 60                    # 게시판 대화에서 고르고 끝날 때까지 최대 (초)

# 은동전: 20개 단위로 사냥터/던전에 배분. 아래는 기본값이고 캐릭터별로 [silver.by_slot.<슬롯>] 에서 덮어쓴다.
[silver]
unit = 20
field = "창백한 산"                   # 사냥터
field_runs = 1                        # 사냥터 최대 횟수 (0 = 던전만)
field_difficulty_y = 113              # 사냥터 창 난이도 버튼 y. '추천' 표시가 붙은 난이도를 고른다
black_hole_in_field = true            # 사냥터에 들어가면 검은 구멍부터 한 번 (오늘 아직 안 했으면)
min_units_for_field = 2               # 은동전이 20 x 이 값 이상일 때만 사냥터 (20개뿐이면 던전 1회)
dungeon = "피오드 던전"               # 남은 은동전으로 돌 던전 ("" = 사냥터만)
difficulty = ""                       # "" = 던전 창에 선택된 그대로 / "일반" / "어려움"
floor = 1                             # 돌 층
zone = 3                              # 돌 구역 (1, 2, 3=보스)
dungeon_cost = 20                     # 입장 버튼의 은동전 가격 (소탕 10 + 더블 루팅 10). 다르면 입장하지 않음
field_timeout = 2400                  # 사냥터 1회 최대 대기 (초)
travel_timeout = 300
clear_timeout = 600

# 예) 사냥터 2회 후 남은 은동전은 룬다 던전 2층 1구역 어려움
# [silver.by_slot.N]
# field_runs = 2
# dungeon = "룬다 던전"
# difficulty = "어려움"
# floor = 2
# zone = 1
#
# 예) 던전만 / 사냥터만
# [silver.by_slot.5]
# field_runs = 0
# [silver.by_slot.6]
# dungeon = ""
# field_runs = 5

# 퀘스트 창(J) → 메인 탭 → '모험가 길드의 고난도 심층 공략' 진행하기 → 심층 던전(매우 어려움)
[tribute]
list_scroll_at = [1540, 600]          # 퀘스트 창 오른쪽 목록 스크롤 위치
cost = 2                              # 1회 입장에 필요한 공물
quest_card = "quest_card_tribute"     # 퀘스트 창 메인 탭의 고난도 퀘스트 카드 제목
quest_go = "quest_go_orange"          # 메인 퀘스트 카드의 주황색 '진행하기'
dungeon_tab = "dungeon_tab_deep_on"   # 이동 도착 후 던전 창의 '심층 던전' 탭 (선택된 상태)
very_hard = "dungeon_deep_veryhard_on" # '매우 어려움' 선택된 상태
quest_wait = 180                      # 퀘스트가 나타날 때까지 최대 대기 (초). 앞 숙제를 하는 동안 보통 뜬다. 안 뜨면 건너뜀
max_runs = 1                          # 숙제로는 하루 1회 (고난도 심층 퀘스트 한 번 깨면 완료). 공물이 남아도 더 돌지 않는다
travel_timeout = 600
clear_timeout = 900

# '/' 콘텐츠 가이드 → 검은 구멍 '바로 가기' → 이동 후 즉시 입장 (입장 즉시 횟수 차감, 클리어까지 머묾)
[black_hole]
achieved = "guide_daily_blackhole"   # 콘텐츠 가이드 일일 달성의 '검은 구멍' (완료 체크 확인)
card = "guide_card_blackhole"         # 콘텐츠 가이드의 검은 구멍 카드 제목
space_keyword = "검은 구멍"           # 검은 구멍 안일 때 CLI 장소 이름에 들어가는 글자
travel_timeout = 600
clear_timeout = 900
stall = 15                            # 이동도 전투도 아닌 채로 이만큼(초) 멈춰 있으면 바로 가기를 다시 누른다
max_retries = 5

# 어비스 반복 (리모콘 '어비스' 탭). 함께하기 · 우연한 만남으로 들어가 보상 화면의 '다시 하기'를 반복한다
[boss_skills]
# 어비스·레이드 보스전에서 전투 중 게이지가 차면 쓴다 (일반 던전·숙제에서는 안 씀). 캐릭터 탭 ••• 에서 따로따로 켬
ultimate_slots = []                   # 궁극기를 쓰는 캐릭터 슬롯
paladin_slots = []                    # 팔라딘 변신을 쓰는 캐릭터 슬롯

[abyss]
dungeon = "허상의 정박지"             # 메뉴 → 어비스 목록의 던전 이름
difficulty = "매우 어려움2"             # 입문 / 어려움 / 매우 어려움 / 매우 어려움2
slot = 0                              # 이 슬롯 캐릭터로 접속해서 한다 (0 = 지금 접속한 캐릭터 그대로)
runs = 0                              # 클리어 이만큼 하면 멈춤 (0 = 제한 없음)
minutes = 0                           # 이만큼(분) 지나면 그 판을 끝내고 멈춤 (0 = 제한 없음)
match_timeout = 600                   # 매칭·입장을 이만큼(초) 기다려도 안 되면 처음부터 다시
run_timeout = 1200                    # 한 판이 이만큼(초) 넘게 안 끝나면 나가서 다시
travel_timeout = 300                  # 입구에서 먼 캐릭터('이동하기')가 입구까지 가는 것을 기다리는 최대 초
background = true                     # 입장 뒤로는 게임을 앞에 두지 않고 한다 (가려져 있어도 됨, 내리면 안 됨)
revive = true                         # 쓰러지면 '여기서 부활' (부활 횟수를 다 썼거나 막혔으면 나가서 처음부터). false = 바로 나감
revive_timeout = 10                   # R 을 누르고 부활 신호를 기다리는 최대 (초). 안 오면 막힌 것(전멸·횟수·아이템)으로 보고 나감
repair_below = 0.05                   # 판이 끝났을 때 장비 내구도(패킷)가 이 비율 이하면 나가서 대장간 전체 수리 뒤 다시 입장 (0 = 안 함)

[raid]
raid = "카브락"                        # 메뉴 → 레이드 목록의 레이드 이름 (카브락 / 에이렐 / 화이트 서큐버스)
difficulty = "어려움"                  # 카브락: 입문 / 어려움, 에이렐·화이트 서큐버스: 어려움 / 매우 어려움
slot = 0                              # 이 슬롯 캐릭터로 접속해서 한다 (0 = 지금 접속한 캐릭터 그대로)
runs = 0                              # 클리어 이만큼 하면 멈춤 (0 = 제한 없음)
minutes = 0                           # 이만큼(분) 지나면 그 판을 끝내고 멈춤 (0 = 제한 없음)
run_timeout = 1500                    # 레이드 맵에 들어가서 이만큼(초) 넘게 보스를 못 잡으면 나가서 다시 출항
travel_timeout = 600                  # 선착장에서 먼 캐릭터('이동하기')가 걸어가는 것을 기다리는 최대 초 (실측 약 7분)
sail_timeout = 300                    # 출항을 누르고 레이드 맵에 들어가기까지 상한 (초). 판단은 맵 진입 패킷 — 연출 길이가 레이드마다 달라 넉넉히
result_timeout = 300                  # 보스를 잡고 결과 화면('처치 완료')이 나와 넘기기까지 상한 (초). 판단은 화면 글자
background = true                     # 출항 뒤로는 게임을 앞에 두지 않고 한다 — 그러면 연출은 넘기지 않고 기다린다
revive = true                         # 쓰러지면 '여기서 부활' (부활 횟수를 다 쓰면 나가서 다시 출항)
repair_below = 0.05                   # 판이 끝났을 때 장비 내구도가 이 비율 이하면 필드로 나가 수리 뒤 다시 입장 (0 = 안 함)
